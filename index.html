<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Life, In Receipts</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="app" class="p-6 max-w-7xl mx-auto space-y-6">
    <header class="flex justify-between items-center border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-bold">Your Life, In Receipts</h1>
      <span id="file-status" class="text-xs text-slate-400">No files loaded</span>
    </header>

    <div id="drop-zone" class="border-2 border-dashed border-slate-700 hover:border-brand-500 p-8 rounded-xl text-center cursor-pointer transition">
      <p class="text-slate-300 font-medium">Drag & drop CSV, TSV, or XML files here, or click to upload</p>
      <input type="file" id="file-input" multiple class="hidden" accept=".csv,.tsv,.xml" />
    </div>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
        <p class="text-xs text-slate-400">Total Spend</p>
        <p id="kpi-total-amt" class="text-xl font-bold text-emerald-400">₹0.00</p>
      </div>
      <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
        <p class="text-xs text-slate-400">Total Transactions</p>
        <p id="kpi-total-count" class="text-xl font-bold">0</p>
      </div>
      <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
        <p class="text-xs text-slate-400">Flagged Fraud</p>
        <p id="kpi-fraud-count" class="text-xl font-bold text-red-400">0</p>
      </div>
      <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
        <p class="text-xs text-slate-400">Avg Transaction</p>
        <p id="kpi-avg-amt" class="text-xl font-bold">₹0.00</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="md:col-span-1 bg-slate-800 p-4 rounded-lg border border-slate-700 h-64">
        <canvas id="category-chart"></canvas>
      </div>
      <div class="md:col-span-2 space-y-4">
        <div class="flex gap-2">
          <input type="text" id="search-input" placeholder="Search merchant, customer..." class="bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm w-full" />
          <select id="category-filter" class="bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm">
            <option value="ALL">All Categories</option>
          </select>
          <select id="fraud-filter" class="bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm">
            <option value="ALL">All Status</option>
            <option value="1">Fraud Only</option>
            <option value="0">Verified Only</option>
          </select>
        </div>
        <div class="overflow-x-auto bg-slate-800 rounded-lg border border-slate-700">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-700/50 text-slate-300 text-xs">
              <tr>
                <th class="p-3">ID</th>
                <th class="p-3">Date</th>
                <th class="p-3">Customer</th>
                <th class="p-3">Card</th>
                <th class="p-3">Merchant</th>
                <th class="p-3">Category</th>
                <th class="p-3">Amount</th>
                <th class="p-3">Status</th>
                <th class="p-3 text-right">Action</th>
              </tr>
            </thead>
            <tbody id="transaction-rows" class="divide-y divide-slate-700"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="receipt-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden">
    <div class="bg-slate-800 p-6 rounded-xl max-w-sm w-full space-y-4 border border-slate-700">
      <h3 class="font-bold text-lg">Receipt Details</h3>
      <div id="modal-body"></div>
      <button id="close-modal" class="w-full bg-slate-700 hover:bg-slate-600 py-2 rounded text-sm font-medium">Close</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
